<title>Pepillion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one centered lab-notebook column on graph paper. The prompt card sits on top and the growing peptide chain sits below it. */
:root{
  --paper:#eef3ef; --grid:rgba(21,35,58,.06); --card:#fbfdfc; --ink:#15233a; --ink-2:#4d5d72; --line:#c9d6cf;
  --accent:#0f7a6b; --accent-ink:#ffffff; --bad:#c2413a;
  --t0:#b9c3c0; --t1:#6b8fb8; --t2:#2f9e6e; --t3:#e0782f; --t4:#8a4fd1;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1716; --grid:rgba(230,239,236,.045); --card:#16211f; --ink:#e6efec; --ink-2:#9fb2ad; --line:#2a3a37;
  --accent:#4fd1b5; --accent-ink:#06201b; --bad:#f07a72;
  --t0:#3c4a47; --t1:#7fa3cc; --t2:#49c48c; --t3:#f0954f; --t4:#b083f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1716; --grid:rgba(230,239,236,.045); --card:#16211f; --ink:#e6efec; --ink-2:#9fb2ad; --line:#2a3a37;
  --accent:#4fd1b5; --accent-ink:#06201b; --bad:#f07a72;
  --t0:#3c4a47; --t1:#7fa3cc; --t2:#49c48c; --t3:#f0954f; --t4:#b083f0; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background-color:var(--paper); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;
}
.wrap{max-width:680px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
.logo{font-family:var(--display); font-weight:800; font-size:clamp(28px,6vw,38px); letter-spacing:-.02em; margin:0; line-height:1}
.logo span{color:var(--accent)}
.meta{font-family:var(--mono); font-size:13px; color:var(--ink-2); display:flex; gap:14px; flex-wrap:wrap}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; display:flex; flex-direction:column; gap:14px}
.eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); display:flex; justify-content:space-between; gap:10px}
h2{font-family:var(--display); font-weight:700; font-size:clamp(24px,5vw,32px); line-height:1.12; letter-spacing:-.015em; margin:0; text-wrap:balance}
.hint{color:var(--ink-2); margin:0}
p{margin:0}
.lede{max-width:60ch}
.rules{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:0; padding:0; list-style:none}
.rules li{border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; color:var(--ink-2)}
.rules b{display:block; color:var(--ink); font-weight:600; margin-bottom:2px}
.row{display:flex; gap:10px; flex-wrap:wrap}
input[type=text]{
  flex:1 1 220px; min-width:0; font:500 18px var(--body); color:var(--ink); background:var(--paper);
  border:1.5px solid var(--line); border-radius:10px; padding:12px 14px; outline:none;
}
input[type=text]:focus-visible{border-color:var(--accent)}
button{font:600 15px var(--body); border-radius:10px; padding:12px 18px; cursor:pointer; border:1.5px solid var(--line); background:transparent; color:var(--ink)}
button.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
button:disabled{opacity:.5; cursor:default}
.timer{height:6px; border-radius:6px; background:var(--line); overflow:hidden}
.timer i{display:block; height:100%; width:100%; background:var(--accent); transform-origin:left; transition:transform .1s linear}
.timer.low i{background:var(--bad)}
.fb{border-top:1px dashed var(--line); padding-top:14px; display:flex; flex-direction:column; gap:8px}
.verdict{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.verdict strong{font-family:var(--display); font-size:22px}
.gain{font-family:var(--mono); font-weight:700; font-size:18px}
.chip{font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:99px; color:#fff; background:var(--t0)}
.chip.c1{background:var(--t1)} .chip.c2{background:var(--t2)} .chip.c3{background:var(--t3)} .chip.c4{background:var(--t4)}
.chip.c0{color:var(--ink)}
.note{color:var(--ink-2); font-size:15px}
.cuts{font-size:14px; color:var(--ink-2)}
.cuts b{color:var(--t4); font-weight:600}
.chainbox{display:flex; flex-direction:column; gap:8px}
.chainhead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.count{font-family:var(--mono); font-weight:700; font-size:clamp(28px,7vw,40px); line-height:1; font-variant-numeric:tabular-nums}
.count small{font-size:14px; font-weight:500; color:var(--ink-2)}
.next{font-size:14px; color:var(--ink-2)}
canvas{width:100%; display:block}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); font-family:var(--mono)}
.legend span::before{content:""; display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; background:var(--c)}
.recap{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.recap li{display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:10px 0; border-bottom:1px solid var(--line)}
.recap li:last-child{border-bottom:0}
.recap .q{font-size:13px; color:var(--ink-2); grid-column:1/-1}
.recap .a{font-weight:600; min-width:0; overflow-wrap:anywhere}
.recap .r{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right}
.share{font-family:var(--mono); font-size:14px; white-space:pre-wrap; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px; margin:0; user-select:all}
.source{font-size:13px; color:var(--ink-2)}
footer{font-size:12px; color:var(--ink-2); text-align:center; max-width:60ch; margin:0 auto}
@keyframes pop{from{transform:scale(.96); opacity:.6} to{transform:none; opacity:1}}
.fb{animation:pop .18s ease-out}
@media (prefers-reduced-motion: reduce){.fb{animation:none} .timer i{transition:none}}
</style>

<div class="wrap">

    <h1 class="logo">Pep<span>i</span>llion</h1>
    <div class="meta"><span id="dayLabel">Daily #1</span><span id="srcLabel">Answer key rarity</span></div>

  <section class="card" id="screen"></section>

  <footer>Pepillion is a trivia game for learning peptide science. Nothing here is medical advice or a recommendation to use any compound.</footer>
</div>

     [4,"Homocarnosine"],[4,"Kyotorphin"],[4,"Vilon"],[4,"Cyclo(His-Pro)","cyclohispro"],[4,"Bortezomib"],[4,"Thyrotropin-releasing hormone","thyrotropinreleasinghormone"]],
  t:[["Glutamine","Glutamine is a single amino acid."],["BCAA","BCAAs are three separate amino acids, not bonded together.","bcaas"],["Creatine","Creatine is a small molecule made from amino acids."]]},
 {id:"hunger", q:"Name a hormone or peptide that controls hunger", hint:"Gut-brain signals for hunger and fullness.",
  a:[[1,"Ghrelin"],[1,"Leptin"],[1,"GLP-1","glp1"],[2,"Insulin"],[2,"Peptide YY","pyy"],[2,"Cholecystokinin","cck"],[2,"Amylin"],[2,"Neuropeptide Y","npy"],[2,"Orexin","hypocretin"],
     [2,"Alpha-MSH","alphamsh","msh"],[2,"Glucagon"],[3,"AgRP","agoutirelatedpeptide"],[3,"Oxyntomodulin"],[3,"GIP"],[3,"CART"],[3,"MCH","melaninconcentratinghormone"],[3,"Obestatin"],[3,"Galanin"],
     [3,"Nesfatin-1","nesfatin"],[4,"Pancreatic polypeptide","pp"],[4,"Enterostatin"],[4,"Uroguanylin"],[4,"GDF15","gdf15"]],
  t:[["Serotonin","Serotonin shapes appetite, but it's a monoamine."],["Dopamine","Dopamine is a monoamine."],["Cortisol","Cortisol affects appetite, but it's a steroid."]]},
 {id:"muscle", q:"Name a protein found in muscle or connective tissue", hint:"The long chains that peptides grow up into.",
  a:[[1,"Actin"],[1,"Myosin"],[1,"Collagen"],[2,"Titin"],[2,"Elastin"],[2,"Troponin"],[2,"Tropomyosin"],[2,"Myoglobin"],[2,"Dystrophin"],[2,"Fibronectin"],
     [3,"Nebulin"],[3,"Desmin"],[3,"Fibrillin"],[3,"Decorin"],[3,"Laminin"],[3,"Obscurin"],[3,"Myostatin"],[3,"Follistatin"],
     [4,"Tenascin"],[4,"Aggrecan"],[4,"Myomesin"],[4,"Alpha-actinin","alphaactinin","actinin"],[4,"Dysferlin"],[4,"Calsequestrin"],[4,"Lumican"],[4,"Tenomodulin"],[4,"Cofilin"]],
  t:[["Creatine","Creatine is a small-molecule fuel, not a protein."],["Glycogen","Glycogen is a sugar polymer, not a protein."]]},
];

const TIERS = {0:{name:"Miss",res:0,emoji:"⬛"},1:{name:"Common",res:12,emoji:"🟦"},2:{name:"Uncommon",res:30,emoji:"🟩"},3:{name:"Rare",res:55,emoji:"🟧"},4:{name:"Deep cut",res:85,emoji:"🟪"}};
const MILESTONES = [[3,"GHK-Cu"],[9,"Oxytocin"],[15,"BPC-157"],[29,"Glucagon"],[31,"Semaglutide"],[43,"Thymosin β4"],[51,"Insulin"],[70,"IGF-1"],[146,"Leptin"],[191,"growth hormone"],[375,"Actin"],[585,"serum albumin"]];
const ROUNDS = 7, SECONDS = 20, LIVE_MIN = 8;
const EPOCH = Date.UTC(2026,10,12);

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const norm = s => String(s).toLowerCase().normalize("NFKD").replace(/[^a-z0-9αβγ]/g,"");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function lev(a,b){ if(Math.abs(a.length-b.length)>2) return 9; const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pick(seed){ const r=rng(seed), idx=PROMPTS.map((_,i)=>i); for(let i=idx.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; } return idx.slice(0,ROUNDS).map(i=>PROMPTS[i]); }
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

const now = new Date();
const dayKey = now.toISOString().slice(0,10);
const dayNum = Math.max(1, Math.floor((Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate())-EPOCH)/864e5)+1);
$("#dayLabel").textContent = "Daily #" + dayNum;

// Build lookup indexes per prompt
for (const p of PROMPTS){
  p.idx = new Map();
  for (const [tier,name,...al] of p.a) for (const k of [name,...al]) { const n=norm(k); if(!p.idx.has(n)) p.idx.set(n,{kind:"ok",tier,name}); }
  for (const [name,note,...al] of p.t) for (const k of [name,...al]) { const n=norm(k); if(!p.idx.has(n)) p.idx.set(n,{kind:"trap",name,note}); }
}
function match(p, input){
  const n = norm(input); if (!n) return null;
  if (p.idx.has(n)) return p.idx.get(n);
  if (n.length < 5) return null;
  const max = n.length >= 9 ? 2 : 1; let best=null, bd=9;
  for (const [k,v] of p.idx) { if (k.length < 5) continue; const d = lev(n,k); if (d<bd){ bd=d; best=v; } }
  return bd <= max ? best : null;
}

// ---------- Live community rarity (optional) ----------
const live = { on:false, uid:null, db:null, plays:new Map() }; // docId -> answers
function liveStats(qid){
  let total=0; const counts=new Map();
  for (const [id,ans] of live.plays){ if (live.uid && id===dayKey+"_"+live.uid) continue; const a=ans&&ans[qid]; if(a===undefined) continue; total++; if(a) counts.set(a,(counts.get(a)||0)+1); }
  return {total, counts};
}
function score(p, hit){
  if (!hit || hit.kind!=="ok") return {res:0, tier:0, share:null};
  const s = live.on ? liveStats(p.id) : {total:0};
  if (s.total >= LIVE_MIN){
    const share = (s.counts.get(hit.name)||0) / (s.total+1);
    const res = Math.max(8, Math.min(100, Math.round(8 + 92*Math.pow(1-share, 2))));
    return {res, tier: res<20?1:res<45?2:res<70?3:4, share};
  }
  return {res:TIERS[hit.tier].res, tier:hit.tier, share:null};
}
async function initLive(){
  try{
    if (!window.claude?.use) return;
    const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    live.db = db; live.uid = await user.id();
    db.collection("plays").where("day","==",dayKey).onSnapshot(snap => {
      live.plays = new Map(snap.docs.map(d => [d.id, (d.data()||{}).answers||{}]));
      live.on = true;
      const players = live.plays.size;
      $("#srcLabel").textContent = players ? players + (players===1?" player today":" players today") : "Be first today";
    }, () => { live.on=false; });
  }catch(e){ /* fall back to the built-in answer key */ }
}
async function saveLive(answers){
  if (!live.db || !live.uid) return;
  try{ await live.db.collection("plays").doc(dayKey+"_"+live.uid).set({day:dayKey, answers}); }catch(e){}
}

// ---------- Chain canvas ----------
const cv = $("#chain"), cx = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let beads = [], shown = 0, raf = 0;
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawChain(){
  const w = cv.clientWidth || 600, dpr = devicePixelRatio || 1;
  const d = w < 480 ? 9 : 11, cols = Math.max(8, Math.floor((w-4)/d));
  const rows = Math.max(1, Math.ceil(Math.max(beads.length,1)/cols));
  const h = rows*d + 6;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); cv.style.height = h+"px";
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,w,h);
  const pos = i => { const r=Math.floor(i/cols), c=i%cols, col = r%2 ? cols-1-c : c; return [2+d/2+col*d, 3+d/2+r*d]; };
  const n = Math.floor(shown);
  if (n===0){ cx.fillStyle = cssVar("--ink-2"); cx.font = "13px " + cssVar("--mono"); cx.fillText("Your chain grows as you answer.", 2, 3+d/2+4); return; }
  cx.strokeStyle = cssVar("--line"); cx.lineWidth = 2; cx.beginPath();
  for (let i=0;i<n;i++){ const [x,y]=pos(i); i?cx.lineTo(x,y):cx.moveTo(x,y); } cx.stroke();
  const cols4 = [0,1,2,3,4].map(t => cssVar("--t"+t));
  for (let i=0;i<n;i++){ const [x,y]=pos(i); cx.fillStyle = cols4[beads[i]]; cx.beginPath(); cx.arc(x,y,d*0.38,0,Math.PI*2); cx.fill(); }
}
function animateTo(){
  cancelAnimationFrame(raf);
  if (reduce){ shown = beads.length; drawChain(); return; }
  const step = () => { shown = Math.min(beads.length, shown + Math.max(1, (beads.length-shown)/12)); drawChain(); if (shown < beads.length) raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
}
function setResidues(total){
  $("#resCount").textContent = total;
  const next = MILESTONES.find(m => m[0] > total);
  const passed = [...MILESTONES].reverse().find(m => m[0] <= total);
  $("#milestone").textContent = next ? (passed ? "Longer than " + passed[1] + ". " : "") + "Next: " + next[1] + " (" + next[0] + ")" : "Longer than serum albumin. Huge.";
}
addEventListener("resize", drawChain);
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", drawChain);
new MutationObserver(drawChain).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

// ---------- Game ----------
const S = $("#screen");
let game = null, timer = 0;

function startScreen(){
  const done = store.get("pep-" + dayKey);
  S.innerHTML = `
    <div class="eyebrow"><span>How to play</span><span>${ROUNDS} prompts · ${SECONDS}s each</span></div>
    <h2>Build the longest peptide chain with answers nobody else thought of.</h2>
    <p class="lede hint">Every correct answer adds amino-acid residues to your chain. Obvious answers add a few. Rare ones add a lot. Some answers look right but aren't peptides at all. Those add nothing.</p>
    <ul class="rules">
      <li><b>Common</b>+${TIERS[1].res} residues</li><li><b>Uncommon</b>+${TIERS[2].res} residues</li>
      <li><b>Rare</b>+${TIERS[3].res} residues</li><li><b>Deep cut</b>+${TIERS[4].res} residues</li>
    </ul>
    <p class="source">${live.on ? "Rarity updates from what other players answered today, once enough people have played." : "Rarity comes from the Pepillion answer key."}</p>
    <div class="row">${done ? `<button class="primary" id="seeBtn">See today's result</button>` : `<button class="primary" id="goBtn">Play today's chain</button>`}<button id="freeBtn">Free play</button></div>`;
  $("#goBtn")?.addEventListener("click", () => begin(true));
  $("#seeBtn")?.addEventListener("click", () => endScreen(done, true));
  $("#freeBtn").addEventListener("click", () => begin(false));
  beads = []; shown = 0; drawChain(); setResidues(0);
  ($("#goBtn")||$("#seeBtn")).focus({preventScroll:true});
}

function begin(daily){
  const seed = daily ? dayNum*7919 : (Math.random()*1e9)|0;
  game = { daily, prompts: pick(seed), i:0, total:0, log:[], answers:{} };
  beads = []; shown = 0; setResidues(0); drawChain();
  ask();
}

function ask(){
  const p = game.prompts[game.i];
  S.innerHTML = `
    <div class="eyebrow"><span>Prompt ${game.i+1} of ${ROUNDS}</span><span id="secs">${SECONDS}s</span></div>
    <h2>${esc(p.q)}</h2>
    <p class="hint">${esc(p.hint)}</p>
    <form class="row" id="f" autocomplete="off">
      <input type="text" id="ans" placeholder="Type an answer" aria-label="Your answer" autocapitalize="off" spellcheck="false">
      <button class="primary" type="submit">Lock in</button>
      <button type="button" id="skip">Skip</button>
    </form>
    <div class="timer" aria-hidden="true"><i id="bar"></i></div>
    <div id="fbSlot"></div>`;
  const inp = $("#ans"); inp.focus({preventScroll:true});
  const t0 = performance.now();
  clearInterval(timer);
  timer = setInterval(() => {
    const left = Math.max(0, SECONDS - (performance.now()-t0)/1000);
    $("#bar").style.transform = `scaleX(${left/SECONDS})`;
    $(".timer").classList.toggle("low", left < 5);
    $("#secs").textContent = Math.ceil(left) + "s";
    if (left <= 0) resolve(p, inp.value, true);
  }, 100);
  $("#f").addEventListener("submit", e => { e.preventDefault(); if (inp.value.trim()) resolve(p, inp.value, false); });
  $("#skip").addEventListener("click", () => resolve(p, "", false));
}

function resolve(p, raw, timedOut){
  clearInterval(timer);
  const hit = match(p, raw);
  const sc = score(p, hit);
  game.total += sc.res;
  game.answers[p.id] = hit && hit.kind==="ok" ? hit.name : null;
  game.log.push({q:p.q, input:raw.trim(), name: hit ? hit.name : null, kind: hit ? hit.kind : "miss", res:sc.res, tier:sc.tier});
  for (let k=0;k<sc.res;k++) beads.push(sc.tier);
  setResidues(game.total); animateTo();

  $("#f").querySelectorAll("input,button").forEach(el => el.disabled = true);
  let head, note = "";
  if (hit && hit.kind==="ok"){
    head = `<strong>${esc(hit.name)}</strong><span class="chip c${sc.tier}">${TIERS[sc.tier].name}</span><span class="gain">+${sc.res}</span>`;
    if (sc.share !== null) note = `${Math.round(sc.share*100)}% of today's players said this.`;
  } else if (hit && hit.kind==="trap"){
    head = `<strong>${esc(hit.name)}</strong><span class="chip c0">Not quite</span><span class="gain">+0</span>`; note = hit.note;
  } else {
    head = `<strong>${timedOut && !raw.trim() ? "Time's up" : raw.trim() ? "Not on the list" : "Skipped"}</strong><span class="gain">+0</span>`;
    if (raw.trim()) note = `"${esc(raw.trim())}" isn't in the answer key for this prompt.`;
  }
  const chosen = hit && hit.name;
  const deep = p.a.filter(a => a[0]===4 && a[1]!==chosen).sort(() => Math.random()-.5).slice(0,2).map(a => `<b>${esc(a[1])}</b>`);
  const last = game.i === ROUNDS-1;
  $("#fbSlot").innerHTML = `<div class="fb" role="status">
      <div class="verdict">${head}</div>
      ${note ? `<p class="note">${note}</p>` : ""}
      ${deep.length ? `<p class="cuts">Deep cuts you could have played: ${deep.join(", ")}</p>` : ""}
      <div class="row"><button class="primary" id="nextBtn">${last ? "See my chain" : "Next prompt"}</button></div>
    </div>`;
  const nb = $("#nextBtn"); nb.focus({preventScroll:true});
  nb.addEventListener("click", () => { if (last) finish(); else { game.i++; ask(); } });
}

function finish(){
  const result = { day:dayKey, num:dayNum, total:game.total, log:game.log, daily:game.daily };
  if (game.daily){ store.set("pep-" + dayKey, result); saveLive(game.answers); }
  endScreen(result, false);
}

function endScreen(r, replay){
  if (replay){ beads = []; r.log.forEach(l => { for(let k=0;k<l.res;k++) beads.push(l.tier); }); shown = 0; setResidues(r.total); animateTo(); }
  const passed = [...MILESTONES].reverse().find(m => m[0] <= r.total);
  const next = MILESTONES.find(m => m[0] > r.total);
  const hits = r.log.filter(l => l.kind==="ok").length;
  const share = `Pepillion ${r.daily ? "#"+r.num : "free play"} · ${r.total} residues\n${r.log.map(l => TIERS[l.tier].emoji).join("")}\n${passed ? "Longer than " + passed[1] : "Still a tiny chain"}`;
  S.innerHTML = `
    <div class="eyebrow"><span>${r.daily ? "Daily #" + r.num + " complete" : "Free play complete"}</span><span>${hits}/${r.log.length} correct</span></div>
    <h2>${r.total} residues. ${passed ? `Longer than ${esc(passed[1])} (${passed[0]}).` : "Not even a tripeptide yet."}</h2>
    <p class="hint">${next ? `${next[0]-r.total} more residues and you'd have out-built ${esc(next[1])}.` : "You out-built serum albumin. That's 585 residues."}</p>
    <ul class="recap">${r.log.map(l => `<li><span class="q">${esc(l.q)}</span>
      <span class="a">${l.name ? esc(l.name) : (l.input ? `<s>${esc(l.input)}</s>` : "—")} <span class="chip c${l.tier}">${l.kind==="trap" ? "Not quite" : TIERS[l.tier].name}</span></span>
      <span class="r">+${l.res}</span></li>`).join("")}</ul>
    <pre class="share" id="shareTxt">${esc(share)}</pre>
    <div class="row"><button class="primary" id="copyBtn">Copy result</button><button id="freeBtn">Free play</button><button id="homeBtn">How to play</button></div>
    ${r.daily ? `<p class="source">A new chain unlocks tomorrow (UTC).</p>` : ""}`;
  $("#copyBtn").addEventListener("click", e => {
    const b = e.currentTarget;
    navigator.clipboard.writeText(share).then(() => { b.textContent = "Copied"; }, () => {
      const sel = getSelection(), rg = document.createRange(); rg.selectNodeContents($("#shareTxt")); sel.removeAllRanges(); sel.addRange(rg); b.textContent = "Selected. Press Ctrl+C";
    });
  });
  $("#freeBtn").addEventListener("click", () => begin(false));
  $("#homeBtn").addEventListener("click", startScreen);
}

startScreen();
initLive();
</script>
