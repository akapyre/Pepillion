<title>Pepillion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: volcano cross-section gauge on the left (a strip on top on phones), prompt card on the right. One committed dark look: basalt, ash, embers. */
:root{
  --basalt:#120d0b; --rock:#1c1512; --ash:#33271f; --bone:#f3e7dc; --smoke:#b9a698;
  --ember:#ff6a2b; --ember-ink:#1a0c05; --bad:#ff8a7a;
  --t0:#4d3f37; --t1:#a9b6bd; --t2:#e8bd4f; --t3:#ff7a2f; --t4:#ff3d63;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--basalt); color:var(--bone); font-family:var(--body); font-size:16px; line-height:1.5;
  background-image:radial-gradient(120% 60% at 50% 115%, rgba(255,90,30,.16), transparent 70%);
  background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;
}
.wrap{max-width:940px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap}
.logo{font-family:var(--display); font-weight:900; font-size:clamp(40px,8vw,56px); letter-spacing:.01em; margin:0; line-height:.9; text-transform:uppercase}
.logo span{color:var(--ember)}
.meta{font-family:var(--mono); font-size:13px; color:var(--smoke); display:flex; gap:14px; flex-wrap:wrap}
.main{display:grid; grid-template-columns:260px minmax(0,1fr); gap:18px; align-items:start}
@media (max-width:760px){ .main{grid-template-columns:minmax(0,1fr)} }
.gauge{background:var(--rock); border:1px solid var(--ash); border-radius:14px; overflow:hidden; position:sticky; top:calc(env(safe-area-inset-top, 0px) + 12px)}
@media (max-width:760px){ .gauge{position:static} }
.gauge canvas{display:block; width:100%; height:560px}
@media (max-width:760px){ .gauge canvas{height:220px} }
.readout{padding:12px 14px; border-top:1px solid var(--ash); display:flex; flex-direction:column; gap:2px}
.depth{font-family:var(--display); font-weight:800; font-size:44px; line-height:1; font-variant-numeric:tabular-nums}
.depth small{font-size:20px; color:var(--smoke); font-weight:700}
.zone{font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ember)}
.next{font-size:13px; color:var(--smoke)}
.card{background:var(--rock); border:1px solid var(--ash); border-radius:14px; padding:22px; display:flex; flex-direction:column; gap:14px; min-width:0}
.eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--smoke); display:flex; justify-content:space-between; gap:10px}
h2{font-family:var(--display); font-weight:800; font-size:clamp(30px,5.4vw,42px); line-height:1.02; letter-spacing:.005em; margin:0; text-wrap:balance; text-transform:uppercase}
.hint{color:var(--smoke); margin:0}
p{margin:0}
.lede{max-width:60ch}
.rules{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin:0; padding:0; list-style:none}
.rules li{border:1px solid var(--ash); border-radius:10px; padding:10px 12px; font-size:14px; color:var(--smoke)}
.rules b{display:block; color:var(--bone); font-weight:600; margin-bottom:2px}
.rules i{font-style:normal; font-family:var(--mono)}
.row{display:flex; gap:10px; flex-wrap:wrap}
input[type=text]{
  flex:1 1 220px; min-width:0; font:500 18px var(--body); color:var(--bone); background:var(--basalt);
  border:1.5px solid var(--ash); border-radius:10px; padding:12px 14px; outline:none;
}
input[type=text]::placeholder{color:var(--smoke); opacity:.7}
input[type=text]:focus-visible{border-color:var(--ember)}
button{font:600 15px var(--body); border-radius:10px; padding:12px 18px; cursor:pointer; border:1.5px solid var(--ash); background:transparent; color:var(--bone)}
button:hover{border-color:var(--smoke)}
button.primary{background:var(--ember); border-color:var(--ember); color:var(--ember-ink)}
button:focus-visible{outline:3px solid var(--t2); outline-offset:2px}
button:disabled{opacity:.45; cursor:default}
.timer{height:6px; border-radius:6px; background:var(--ash); overflow:hidden}
.timer i{display:block; height:100%; width:100%; background:linear-gradient(90deg,var(--t2),var(--ember)); transform-origin:left; transition:transform .1s linear}
.timer.low i{background:var(--t4)}
.fb{border-top:1px dashed var(--ash); padding-top:14px; display:flex; flex-direction:column; gap:8px; animation:rise .2s ease-out}
.verdict{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.verdict strong{font-family:var(--display); font-size:28px; font-weight:800; text-transform:uppercase; line-height:1}
.gain{font-family:var(--mono); font-weight:700; font-size:18px}
.chip{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; border-radius:99px; color:var(--ember-ink); background:var(--t0)}
.chip.c0{color:var(--bone)} .chip.c1{background:var(--t1)} .chip.c2{background:var(--t2)} .chip.c3{background:var(--t3)} .chip.c4{background:var(--t4); color:#fff}
.note{color:var(--smoke); font-size:15px}
.cuts{font-size:14px; color:var(--smoke)}
.cuts b{color:var(--t4); font-weight:600}
.recap{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.recap li{display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:10px 0; border-bottom:1px solid var(--ash)}
.recap li:last-child{border-bottom:0}
.recap .q{font-size:13px; color:var(--smoke); grid-column:1/-1}
.recap .a{font-weight:600; min-width:0; overflow-wrap:anywhere}
.recap .r{font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right}
.recap s{color:var(--smoke)}
.share{font-family:var(--mono); font-size:14px; white-space:pre-wrap; background:var(--basalt); border:1px solid var(--ash); border-radius:10px; padding:12px; margin:0; user-select:all}
.source{font-size:13px; color:var(--smoke)}
footer{font-size:12px; color:var(--smoke); text-align:center; max-width:60ch; margin:0 auto}
@keyframes rise{from{transform:translateY(4px); opacity:.5} to{transform:none; opacity:1}}
@media (prefers-reduced-motion: reduce){.fb{animation:none} .timer i{transition:none}}
</style>

const ROUNDS = 7, SECONDS = 20, LIVE_MIN = 8;
const EPOCH = Date.UTC(2026,10,12);

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const norm = s => String(s).toLowerCase().normalize("NFKD").replace(/[^a-z0-9αβγ]/g,"");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n).toLocaleString("en-US");
function lev(a,b){ if(Math.abs(a.length-b.length)>2) return 9; const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pick(seed){ const r=rng(seed), idx=PROMPTS.map((_,i)=>i); for(let i=idx.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; } return idx.slice(0,ROUNDS).map(i=>PROMPTS[i]); }
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const zoneAt = d => [...ZONES].reverse().find(z => z.d <= d);

const now = new Date();
const dayKey = now.toISOString().slice(0,10);
const dayNum = Math.max(1, Math.floor((Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate())-EPOCH)/864e5)+1);
$("#dayLabel").textContent = "Daily #" + dayNum;

for (const p of PROMPTS){
  p.idx = new Map();
  for (const [tier,name,...al] of p.a) for (const k of [name,...al]) { const n=norm(k); if(n && !p.idx.has(n)) p.idx.set(n,{kind:"ok",tier,name}); }
  for (const [name,note,...al] of p.t) for (const k of [name,...al]) { const n=norm(k); if(n && !p.idx.has(n)) p.idx.set(n,{kind:"trap",name,note}); }
}
function match(p, input){
  const n = norm(input); if (!n) return null;
  if (p.idx.has(n)) return p.idx.get(n);
  if (n.length < 5) return null;
  const max = n.length >= 9 ? 2 : 1; let best=null, bd=9;
  for (const [k,v] of p.idx) { if (k.length < 5) continue; const d = lev(n,k); if (d<bd){ bd=d; best=v; } }
  return bd <= max ? best : null;
}

// ---------- Live community rarity (optional) ----------
const live = { on:false, uid:null, db:null, plays:new Map() };
function liveStats(qid){
  let total=0; const counts=new Map();
  for (const [id,ans] of live.plays){ if (live.uid && id===dayKey+"_"+live.uid) continue; const a=ans&&ans[qid]; if(a===undefined) continue; total++; if(a) counts.set(a,(counts.get(a)||0)+1); }
  return {total, counts};
}
function score(p, hit){
  if (!hit || hit.kind!=="ok") return {m:0, tier:0, share:null};
  const s = live.on ? liveStats(p.id) : {total:0};
  if (s.total >= LIVE_MIN){
    const share = (s.counts.get(hit.name)||0) / (s.total+1);
    const m = Math.max(100, Math.min(1000, Math.round((100 + 900*Math.pow(1-share, 2))/10)*10));
    return {m, tier: m<250?1:m<500?2:m<750?3:4, share};
  }
  return {m:TIERS[hit.tier].m, tier:hit.tier, share:null};
}
async function initLive(){
  try{
    if (!window.claude?.use) return;
    const [db,user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    live.db = db; live.uid = await user.id();
    db.collection("plays").where("day","==",dayKey).onSnapshot(snap => {
      live.plays = new Map(snap.docs.map(d => [d.id, (d.data()||{}).answers||{}]));
      live.on = true;
      const n = live.plays.size;
      $("#srcLabel").textContent = n ? n + (n===1?" diver today":" divers today") : "Be first down today";
    }, () => { live.on=false; });
  }catch(e){}
}
async function saveLive(answers){
  if (!live.db || !live.uid) return;
  try{ await live.db.collection("plays").doc(dayKey+"_"+live.uid).set({day:dayKey, answers}); }catch(e){}
}

// ---------- Volcano cross-section ----------
const cv = $("#volcano"), cx = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let depth = 0, shownDepth = 0, marks = [], t0 = performance.now();
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function draw(){
  const w = cv.clientWidth || 260, h = cv.clientHeight || 560, dpr = devicePixelRatio || 1;
  if (cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,w,h);
  const sky = Math.min(70, h*0.2), bottom = h - 8;
  const span = Math.max(2000, Math.ceil((shownDepth + 700)/1000)*1000);
  const y = d => sky + (d/span)*(bottom - sky);
  const mono = css("--mono");
  const cxm = w/2, wob = yy => Math.sin(yy/38)*6;

  const g = cx.createLinearGradient(0,0,0,sky); g.addColorStop(0,"#120d0b"); g.addColorStop(1,"#2b1710");
  cx.fillStyle = g; cx.fillRect(0,0,w,sky);
  ZONES.forEach((z,i) => { const top = y(z.d), bot = i < ZONES.length-1 ? y(ZONES[i+1].d) : bottom; if (top > bottom) return;
    cx.fillStyle = z.col; cx.fillRect(0, top, w, Math.min(bot,bottom) - top); });
  // cone
  cx.fillStyle = "#1c1512";
  for (const s of [-1,1]){ cx.beginPath(); cx.moveTo(cxm + s*w/2, sky+2); cx.lineTo(cxm + s*w/2, sky*0.95); cx.lineTo(cxm + s*28, sky*0.28); cx.lineTo(cxm + s*12, sky*0.34); cx.lineTo(cxm + s*12, sky+2); cx.closePath(); cx.fill(); }
  // smoke
  const tt = (performance.now()-t0)/1000;
  if (!reduce) for (let i=0;i<3;i++){ const ph = (tt*0.25 + i/3)%1; cx.fillStyle = `rgba(185,166,152,${0.18*(1-ph)})`; cx.beginPath(); cx.arc(cxm + Math.sin(ph*6+i)*8, sky*0.3 - ph*sky*0.3, 5 + ph*10, 0, Math.PI*2); cx.fill(); }
  // conduit
  const cw = 14, top0 = sky*0.34;
  cx.fillStyle = "rgba(0,0,0,.35)"; cx.beginPath(); cx.moveTo(cxm-cw+wob(top0), top0);
  for (let yy=top0; yy<=bottom; yy+=6) cx.lineTo(cxm-cw+wob(yy),yy);
  for (let yy=bottom; yy>=top0; yy-=6) cx.lineTo(cxm+cw+wob(yy),yy);
  cx.closePath(); cx.fill();
  // trail, colored by answer tier
  let from = 0; cx.lineWidth = 4; cx.lineCap = "round";
  for (const mk of marks){ const to = Math.min(from + mk.m, shownDepth); if (mk.m && to > from){
      cx.strokeStyle = css("--t"+mk.tier); cx.beginPath(); cx.moveTo(cxm+wob(y(from)), y(from));
      const steps = 24; for (let k=1;k<=steps;k++){ const yy = y(from + (to-from)*k/steps); cx.lineTo(cxm+wob(yy), yy); } cx.stroke(); }
    from += mk.m; if (from >= shownDepth) break; }
  // ticks
  cx.font = "10px " + mono; cx.textAlign = "right"; cx.fillStyle = "rgba(243,231,220,.6)"; cx.strokeStyle = "rgba(243,231,220,.3)"; cx.lineWidth = 1;
  const stepT = span <= 3000 ? 500 : 1000;
  for (let d=stepT; d<=span; d+=stepT){ const yy = y(d); cx.beginPath(); cx.moveTo(w-6,yy); cx.lineTo(w,yy); cx.stroke(); cx.fillText(fmt(d)+" m", w-9, yy+3); }
  // zone labels
  cx.textAlign = "left"; cx.font = "600 10px " + mono; cx.fillStyle = "rgba(243,231,220,.8)";
  ZONES.forEach(z => { const yy = y(z.d); if (z.d===0 || yy > bottom-12) return; cx.fillText(z.name.toUpperCase(), 8, yy+13); });
  // diver glow
  const yd = y(shownDepth), xd = cxm + wob(yd), pulse = reduce ? 0 : Math.sin(tt*4)*1.5;
  const rg = cx.createRadialGradient(xd,yd,0,xd,yd,18+pulse); rg.addColorStop(0,"rgba(255,220,150,.9)"); rg.addColorStop(1,"rgba(255,106,43,0)");
  cx.fillStyle = rg; cx.beginPath(); cx.arc(xd,yd,18+pulse,0,Math.PI*2); cx.fill();
  cx.fillStyle = "#fff4e0"; cx.beginPath(); cx.arc(xd,yd,5,0,Math.PI*2); cx.fill();
}
function updateReadout(d){
  $("#depthNum").textContent = fmt(d);
  const z = zoneAt(d), n = ZONES.find(x => x.d > d);
  $("#zoneName").textContent = z.name + " · " + z.temp;
  $("#nextZone").textContent = n ? `Next: ${n.name} at ${fmt(n.d)} m` : "You reached the deepest zone.";
}
function loop(){
  const diff = depth - shownDepth;
  shownDepth = (reduce || Math.abs(diff) < 2) ? depth : shownDepth + diff*0.06;
  updateReadout(shownDepth); draw();
  requestAnimationFrame(loop);
}
function setDepth(d, instant){ depth = d; if (instant || reduce) shownDepth = d; }

// ---------- Game ----------
const S = $("#screen");
let game = null, timer = 0;

function startScreen(){
  const done = store.get("pepv-" + dayKey);
  marks = []; setDepth(0, true);
  S.innerHTML = `
    <div class="eyebrow"><span>How to play</span><span>${ROUNDS} prompts · ${SECONDS}s each</span></div>
    <h2>Dive into the volcano. Rare answers take you deeper.</h2>
    <p class="lede hint">Each correct answer sinks you further toward the core. Answers everyone knows only drop you a little. The rare ones drop you a long way. Some answers look right but aren't peptides at all. Those leave you where you are.</p>
    <ul class="rules">
      <li><b>Common</b><i>+${TIERS[1].m} m</i></li><li><b>Uncommon</b><i>+${TIERS[2].m} m</i></li>
      <li><b>Rare</b><i>+${TIERS[3].m} m</i></li><li><b>Deep cut</b><i>+${TIERS[4].m} m</i></li>
    </ul>
    <p class="source">${live.on ? "Once enough people have played, depth depends on how rare your answer was today." : "Depth comes from the Pepillion answer key."} ${PROMPTS.length} categories and ${PROMPTS.reduce((s,p)=>s+p.a.length,0)} answers in the key.</p>
    <div class="row">${done ? `<button class="primary" id="seeBtn">See today's dive</button>` : `<button class="primary" id="goBtn">Start today's dive</button>`}<button id="freeBtn">Free dive</button></div>`;
  $("#goBtn")?.addEventListener("click", () => begin(true));
  $("#seeBtn")?.addEventListener("click", () => endScreen(done, true));
  $("#freeBtn").addEventListener("click", () => begin(false));
  ($("#goBtn")||$("#seeBtn")).focus({preventScroll:true});
}

function begin(daily){
  const seed = daily ? dayNum*7919 : (Math.random()*1e9)|0;
  game = { daily, prompts: pick(seed), i:0, total:0, log:[], answers:{} };
  marks = []; setDepth(0, true);
  ask();
}

function ask(){
  const p = game.prompts[game.i];
  S.innerHTML = `
    <div class="eyebrow"><span>Prompt ${game.i+1} of ${ROUNDS}</span><span id="secs">${SECONDS}s</span></div>
    <h2>${esc(p.q)}</h2>
    <p class="hint">${esc(p.hint)}</p>
    <form class="row" id="f" autocomplete="off">
      <input type="text" id="ans" placeholder="Type an answer" aria-label="Your answer" autocapitalize="off" spellcheck="false">
      <button class="primary" type="submit">Lock in</button>
      <button type="button" id="skip">Skip</button>
    </form>
    <div class="timer" aria-hidden="true"><i id="bar"></i></div>
    <div id="fbSlot"></div>`;
  const inp = $("#ans"); inp.focus({preventScroll:true});
  const start = performance.now();
  clearInterval(timer);
  timer = setInterval(() => {
    const left = Math.max(0, SECONDS - (performance.now()-start)/1000);
    $("#bar").style.transform = `scaleX(${left/SECONDS})`;
    $(".timer").classList.toggle("low", left < 5);
    $("#secs").textContent = Math.ceil(left) + "s";
    if (left <= 0) resolve(p, inp.value, true);
  }, 100);
  $("#f").addEventListener("submit", e => { e.preventDefault(); if (inp.value.trim()) resolve(p, inp.value, false); });
  $("#skip").addEventListener("click", () => resolve(p, "", false));
}

function resolve(p, raw, timedOut){
  clearInterval(timer);
  const hit = match(p, raw), sc = score(p, hit);
  game.total += sc.m;
  game.answers[p.id] = hit && hit.kind==="ok" ? hit.name : null;
  game.log.push({q:p.q, input:raw.trim(), name: hit ? hit.name : null, kind: hit ? hit.kind : "miss", m:sc.m, tier:sc.tier});
  marks.push({m:sc.m, tier:sc.tier}); setDepth(game.total);

  $("#f").querySelectorAll("input,button").forEach(el => el.disabled = true);
  let head, note = "";
  if (hit && hit.kind==="ok"){
    head = `<strong>${esc(hit.name)}</strong><span class="chip c${sc.tier}">${TIERS[sc.tier].name}</span><span class="gain">+${fmt(sc.m)} m</span>`;
    if (sc.share !== null) note = `${Math.round(sc.share*100)}% of today's divers said this.`;
  } else if (hit && hit.kind==="trap"){
    head = `<strong>${esc(hit.name)}</strong><span class="chip c0">Not quite</span><span class="gain">+0 m</span>`; note = esc(hit.note);
  } else {
    head = `<strong>${timedOut && !raw.trim() ? "Time's up" : raw.trim() ? "Not on the list" : "Skipped"}</strong><span class="gain">+0 m</span>`;
    if (raw.trim()) note = `"${esc(raw.trim())}" isn't in the answer key for this prompt.`;
  }
  const chosen = hit && hit.name;
  const deep = p.a.filter(a => a[0]===4 && a[1]!==chosen).sort(() => Math.random()-.5).slice(0,3).map(a => `<b>${esc(a[1])}</b>`);
  const last = game.i === ROUNDS-1;
  $("#fbSlot").innerHTML = `<div class="fb" role="status">
      <div class="verdict">${head}</div>
      ${note ? `<p class="note">${note}</p>` : ""}
      ${deep.length ? `<p class="cuts">Deep cuts you could have played: ${deep.join(", ")}</p>` : ""}
      <div class="row"><button class="primary" id="nextBtn">${last ? "Surface and see my dive" : "Keep descending"}</button></div>
    </div>`;
  const nb = $("#nextBtn"); nb.focus({preventScroll:true});
  nb.addEventListener("click", () => { if (last) finish(); else { game.i++; ask(); } });
}

function finish(){
  const result = { day:dayKey, num:dayNum, total:game.total, log:game.log, daily:game.daily };
  if (game.daily){ store.set("pepv-" + dayKey, result); saveLive(game.answers); }
  endScreen(result, false);
}

function endScreen(r, replay){
  if (replay){ marks = r.log.map(l => ({m:l.m, tier:l.tier})); setDepth(0, true); setDepth(r.total); }
  const z = zoneAt(r.total), n = ZONES.find(x => x.d > r.total);
  const hits = r.log.filter(l => l.kind==="ok").length;
  const share = `Pepillion ${r.daily ? "#"+r.num : "free dive"} 🌋 ${fmt(r.total)} m\n${r.log.map(l => TIERS[l.tier].emoji).join("")}\nReached the ${z.name} (${z.temp})`;
  S.innerHTML = `
    <div class="eyebrow"><span>${r.daily ? "Daily #" + r.num + " complete" : "Free dive complete"}</span><span>${hits}/${r.log.length} correct</span></div>
    <h2>${fmt(r.total)} m. You reached the ${esc(z.name)}.</h2>
    <p class="hint">${n ? `${fmt(n.d - r.total)} m more and you'd have hit the ${esc(n.name)}.` : "Nobody gets deeper than the Core Forge."}</p>
    <ul class="recap">${r.log.map(l => `<li><span class="q">${esc(l.q)}</span>
      <span class="a">${l.name ? esc(l.name) : (l.input ? `<s>${esc(l.input)}</s>` : "—")} <span class="chip c${l.tier}">${l.kind==="trap" ? "Not quite" : TIERS[l.tier].name}</span></span>
      <span class="r">+${fmt(l.m)} m</span></li>`).join("")}</ul>
    <pre class="share" id="shareTxt">${esc(share)}</pre>
    <div class="row"><button class="primary" id="copyBtn">Copy result</button><button id="freeBtn">Free dive</button><button id="homeBtn">How to play</button></div>
    ${r.daily ? `<p class="source">A new dive opens tomorrow (UTC).</p>` : ""}`;
  $("#copyBtn").addEventListener("click", e => {
    const b = e.currentTarget;
    navigator.clipboard.writeText(share).then(() => { b.textContent = "Copied"; }, () => {
      const sel = getSelection(), rg = document.createRange(); rg.selectNodeContents($("#shareTxt")); sel.removeAllRanges(); sel.addRange(rg); b.textContent = "Selected. Press Ctrl+C";
    });
  });
  $("#freeBtn").addEventListener("click", () => begin(false));
  $("#homeBtn").addEventListener("click", startScreen);
}

startScreen();
loop();
initLive();
</script>
